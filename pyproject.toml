[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccv"
version = "0.1.0"
description = "Fetch ADS/Scholar publications and build Canadian Common CV XML"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sébastien Fabbro" }]
keywords = ["ccv", "canadian-common-cv", "ads", "bibtex", "nserc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "bibtexparser>=1.4.0,<2",
    "PyYAML>=6.0",
    "scholarly>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/sfabbro/ccv"
Repository = "https://github.com/sfabbro/ccv"
Issues = "https://github.com/sfabbro/ccv/issues"

[project.scripts]
ccv = "ccv.cli:main"
ccv-update = "ccv.update:main"

[tool.hatch.build.targets.wheel]
packages = ["ccv"]

[tool.hatch.build.targets.sdist]
include = [
    "/ccv",
    "/ccv_update.py",
    "/check_schema.py",
    "/README.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[tool.pixi.dependencies]
python = "3.13.*"

[tool.pixi.pypi-dependencies]
ccv = { path = ".", editable = true }
pytest = ">=8.0"

[tool.pixi.tasks]
ccv = "ccv"
update = "ccv-update"
test = "pytest -q"
